<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading course...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a2332; height: 100vh; width: 100vw; overflow: hidden; }
    #loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; }
    .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #028090; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 16px; opacity: 0.8; }
    #course-frame { display: none; width: 100%; height: 100vh; border: none; }
  </style>
</head>
<body>
<div id="loading"><div class="spinner"></div><p>Loading course...</p></div>
<iframe id="course-frame" allowfullscreen></iframe>

<script>
// ── Parse launch params ───────────────────────────────────────────────────────
var params    = new URLSearchParams(window.location.search);
var endpoint  = params.get('endpoint')  || '';
var auth      = params.get('auth')      || '';
var actorRaw  = params.get('actor')     || '{}';
var courseDir = params.get('course')    || 'scormcontent'; // default for backwards compat
var courseId  = params.get('course_id') || '';             // xapi activity id

var actor = {};
try { actor = JSON.parse(actorRaw); } catch(e) {}
var actorEmail = (actor.mbox || '').replace('mailto:','').toLowerCase().trim();
var actorName  = actor.name || actorEmail;

// ── CMI data store ────────────────────────────────────────────────────────────
var cmiData = {
  'cmi.core.lesson_status':   'not attempted',
  'cmi.core.lesson_location': '',
  'cmi.core.score.raw':       '',
  'cmi.core.score.min':       '',
  'cmi.core.score.max':       '',
  'cmi.core.session_time':    '',
  'cmi.suspend_data':         '',
  'cmi.core.student_id':      actorEmail,
  'cmi.core.student_name':    actorName,
  'cmi.core.entry':           'ab-initio',
  'cmi.core.exit':            '',
  'cmi.core.credit':          'credit',
  'cmi.core.lesson_mode':     'normal',
  'cmi.core.total_time':      '0000:00:00.00',
  'cmi.launch_data':          '',
};
var initialized = false;
var isDirty     = false;

// ── xAPI helpers ──────────────────────────────────────────────────────────────
function headers() {
  return {
    'Content-Type': 'application/json',
    'X-Experience-API-Version': '1.0.3',
    'Authorization': 'Basic ' + auth
  };
}
function agentObj() {
  return { objectType: 'Agent', name: actorName, mbox: 'mailto:' + actorEmail };
}
function activityObj() {
  return {
    id: courseId,
    objectType: 'Activity',
    definition: { type: 'http://adlnet.gov/expapi/activities/course' }
  };
}
function sendStatement(verb, verbDisplay, result) {
  if (!endpoint || !actorEmail || !courseId) return;
  var s = {
    actor: agentObj(),
    verb: { id: 'http://adlnet.gov/expapi/verbs/' + verb, display: { 'en-US': verbDisplay } },
    object: activityObj()
  };
  if (result) s.result = result;
  fetch(endpoint + 'statements', {
    method: 'POST',
    headers: headers(),
    body: JSON.stringify([s])
  }).catch(function(){});
}
function saveState() {
  if (!endpoint || !actorEmail || !courseId) return;
  var url = endpoint + 'activities/state?stateId=SCORM_progress'
    + '&activityId=' + encodeURIComponent(courseId)
    + '&agent=' + encodeURIComponent(JSON.stringify(agentObj()));
  fetch(url, {
    method: 'PUT',
    headers: headers(),
    body: JSON.stringify(cmiData)
  }).then(function(){ isDirty = false; }).catch(function(){});
}
function loadState(cb) {
  if (!endpoint || !actorEmail || !courseId) { cb(false); return; }
  var url = endpoint + 'activities/state?stateId=SCORM_progress'
    + '&activityId=' + encodeURIComponent(courseId)
    + '&agent=' + encodeURIComponent(JSON.stringify(agentObj()));
  fetch(url, { method: 'GET', headers: headers() }).then(function(res) {
    if (res.ok) {
      res.json().then(function(saved) {
        if (saved && typeof saved === 'object') {
          Object.assign(cmiData, saved);
          if (cmiData['cmi.core.lesson_location']) cmiData['cmi.core.entry'] = 'resume';
          // If already completed, set review mode
          if (cmiData['cmi.core.lesson_status'] === 'completed' || cmiData['cmi.core.lesson_status'] === 'passed') {
            cmiData['cmi.core.entry'] = 'review';
          }
        }
        cb(true);
      }).catch(function(){ cb(false); });
    } else { cb(false); }
  }).catch(function(){ cb(false); });
}

// ── SCORM 1.2 API ─────────────────────────────────────────────────────────────
var API = {
  LMSInitialize: function(p) {
    initialized = true;
    sendStatement('initialized', 'initialized');
    return 'true';
  },
  LMSFinish: function(p) {
    saveState();
    var status = cmiData['cmi.core.lesson_status'];
    if (status === 'passed' || status === 'completed') {
      sendStatement('completed', 'completed', { success: status==='passed', completion: true });
    } else {
      sendStatement('suspended', 'suspended');
    }
    initialized = false;
    return 'true';
  },
  LMSGetValue: function(el) {
    return cmiData.hasOwnProperty(el) ? String(cmiData[el]) : '';
  },
  LMSSetValue: function(el, val) {
    cmiData[el] = val;
    isDirty = true;
    if (el === 'cmi.core.lesson_location' && val) {
      saveState();
      sendStatement('progressed', 'progressed', { extensions: { bookmark: val } });
    }
    if (el === 'cmi.core.lesson_status' && (val === 'passed' || val === 'completed')) {
      saveState();
      sendStatement('completed', 'completed', { success: val==='passed', completion: true });
    }
    return 'true';
  },
  LMSCommit:         function(p) { saveState(); return 'true'; },
  LMSGetLastError:   function()  { return '0'; },
  LMSGetErrorString: function(c) { return ''; },
  LMSGetDiagnostic:  function(c) { return ''; }
};

// ── Expose standard SCORM API ─────────────────────────────────────────────────
window.API = API;

// ── Expose Rise proxy functions directly on window ────────────────────────────
// Rise calls pick(LMSProxySelections, window.parent, ...) — looks here directly
window.CommitData    = function() { saveState(); };
window.ConcedeControl = function() {};
window.CreateResponseIdentifier = function() { return ''; };
window.Finish        = function() { API.LMSFinish(''); };
window.GetDataChunk  = function() { return cmiData['cmi.suspend_data'] || ''; };
window.GetStatus     = function() { return cmiData['cmi.core.lesson_status']; };
window.GetStudentID  = function() { return actorEmail; };
window.MatchingResponse = function() {};
window.RecordFillInInteraction = function() {};
window.RecordMatchingInteraction = function() {};
window.RecordMultipleChoiceInteraction = function() {};
window.SetBookmark   = function(val) {
  cmiData['cmi.core.lesson_location'] = val;
  saveState();
  sendStatement('progressed', 'progressed', { extensions: { bookmark: val } });
};
window.SetDataChunk  = function(val) { cmiData['cmi.suspend_data'] = val; isDirty = true; };
window.SetFailed     = function() {
  cmiData['cmi.core.lesson_status'] = 'failed';
  saveState();
  sendStatement('failed', 'failed', { success: false });
};
window.SetLanguagePreference = function() {};
window.SetObjectiveStatus    = function() {};
window.SetPassed     = function() {
  cmiData['cmi.core.lesson_status'] = 'passed';
  saveState();
  sendStatement('completed', 'completed', { success: true, completion: true });
};
window.SetReachedEnd = function() {
  cmiData['cmi.core.lesson_status'] = 'completed';
  saveState();
  sendStatement('completed', 'completed', { success: false, completion: true });
};
window.SetScore      = function(s) { cmiData['cmi.core.score.raw'] = s; isDirty = true; };
window.TCAPI_SetCompleted = function() {
  sendStatement('completed', 'completed', { completion: true });
};
window.TCAPI_SetProgressMeasure = function(val) {
  sendStatement('progressed', 'progressed', { result: { score: { scaled: val } } });
};
window.WriteToDebug  = function() {};

// ── Launch ────────────────────────────────────────────────────────────────────
function launch() {
  var frame   = document.getElementById('course-frame');
  var loading = document.getElementById('loading');

  frame.addEventListener('load', function() {
    loading.style.display = 'none';
    frame.style.display   = 'block';
  });

  // bridge.html copies window.parent API then redirects to the course folder
  frame.src = '/bridge.html?course=' + encodeURIComponent(courseDir);
}

// Auto-save every 30s
setInterval(function() { if (initialized && isDirty) saveState(); }, 30000);

// Save on tab close
window.addEventListener('beforeunload', function() { if (initialized) API.LMSFinish(''); });

// Load saved state then launch
loadState(function() {
  sendStatement('attempted', 'attempted');
  launch();
});
</script>
</body>
</html>
